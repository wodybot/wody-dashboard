name: Discord Commit Notification

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-24.04

    steps:
      - name: Send commit notification to Discord
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPO_NAME: ${{ github.event.repository.name }}
          BRANCH: ${{ github.ref_name }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_SHA: ${{ github.sha }}

        run: |
          set -euo pipefail

          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "ERROR: DISCORD_WEBHOOK_URL secret is missing."
            exit 1
          fi

          # Prima linie din commit, fara backticks, maxim 120 caractere
          COMMIT_SUBJECT=$(printf '%s' "$COMMIT_MESSAGE" | head -n 1 | tr -d '`' | cut -c1-120)
          [ -z "$COMMIT_SUBJECT" ] && COMMIT_SUBJECT="Update"

          SHORT_SHA="${COMMIT_SHA:0:7}"

          PAYLOAD=$(jq -n \
            --arg repo "$REPO_NAME" \
            --arg branch "$BRANCH" \
            --arg author "$AUTHOR" \
            --arg commit "$COMMIT_SUBJECT" \
            --arg sha "$SHORT_SHA" \
            '{
              flags: 32768,
              allowed_mentions: { parse: [] },
              components: [
                {
                  type: 17,
                  accent_color: 12804653,
                  components: [
                    {
                      type: 10,
                      content: ("**" + $repo + "**  `" + $branch + "`")
                    },
                    {
                      type: 10,
                      content: $commit
                    },
                    {
                      type: 10,
                      content: ("-# `" + $sha + "` by " + $author + " | Wody Development")
                    },
                    {
                      type: 14,
                      divider: true,
                      spacing: 1
                    },
                    {
                      type: 1,
                      components: [
                        {
                          type: 2,
                          style: 5,
                          label: "Website",
                          url: "https://wody.online"
                        },
                        {
                          type: 2,
                          style: 5,
                          label: "Updates",
                          url: "https://wody.online/updates"
                        }
                      ]
                    }
                  ]
                }
              ]
            }')

          HTTP_STATUS=$(curl -sS \
            -o /tmp/discord_response.txt \
            -w "%{http_code}" \
            -X POST \
            "${DISCORD_WEBHOOK_URL}?wait=true&with_components=true" \
            -H "Content-Type: application/json" \
            --data-raw "$PAYLOAD")

          echo "Discord HTTP status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "ERROR: Discord webhook request failed."
            cat /tmp/discord_response.txt || true
            exit 1
          fi

          echo "Notification sent."
